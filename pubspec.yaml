name: chauve_michel_ops
description: "Local operations workspace for CHAUVE MICHEL asset, quality, shift, and compliance tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - docs/icon.png
    - docs/featured.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "docs/icon.png"
  adaptive_icon_background: "#001330"
  adaptive_icon_foreground: "docs/icon.png"
  min_sdk_android: 23
